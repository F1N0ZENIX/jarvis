name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Configure persistent signing
        env:
          JARVIS_KEYSTORE_BASE64: ${{ secrets.JARVIS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$JARVIS_KEYSTORE_BASE64" ]; then
            echo "$JARVIS_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/jarvis-release.jks"
            echo "JARVIS_KEYSTORE_PATH=$RUNNER_TEMP/jarvis-release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No persistent signing key: debug APK may not update previously installed APKs."
          fi
      - name: Build APK
        env:
          JARVIS_KEYSTORE_PASSWORD: ${{ secrets.JARVIS_KEYSTORE_PASSWORD }}
          JARVIS_KEY_ALIAS: ${{ secrets.JARVIS_KEY_ALIAS }}
          JARVIS_KEY_PASSWORD: ${{ secrets.JARVIS_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/JARVIS release 0.9.2.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-release-0.9.2-debug
          path: app/build/outputs/apk/debug/JARVIS release 0.9.2.apk
name: JARVIS - Orbit base experimental
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/orbit-base.yml'
permissions:
  contents: read
jobs:
  orbit-base:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Orbit source (MPL-2.0)
        uses: actions/checkout@v4
        with:
          repository: lpnovi/Orbit-Assistant
          ref: main
          path: orbit
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Brand and localize experimental JARVIS APK
        working-directory: orbit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/build.gradle")
          s=p.read_text().replace("applicationId 'com.orbit.assistant'", "applicationId 'com.f1n0zenix.jarvis.orbit'")
          p.write_text(s)
          p=Path("app/src/main/res/values/strings.xml")
          s=p.read_text().replace('<string name="app_name">Orbit Assistant</string>','<string name="app_name">JARVIS (Orbit Base)</string>')
          p.write_text(s)
          PY
          # Localização pt-BR das telas e mensagens mais frequentes.
          python3 - <<'PY'
          from pathlib import Path
          translations={
            "Ask anything...":"Pergunte qualquer coisa...",
            "Response failed":"Falha na resposta",
            "Retry":"Tentar novamente",
            "Settings":"Configurações",
            "AI Providers":"Provedores de IA",
            "New chat":"Nova conversa",
            "Chat history":"Histórico de conversas",
            "History":"Histórico",
            "Calendar":"Calendário",
            "Reminders":"Lembretes",
            "Alarms":"Alarmes",
            "Notifications":"Notificações",
            "Appearance":"Aparência",
            "Dark mode":"Modo escuro",
            "Light mode":"Modo claro",
            "Save":"Salvar",
            "Cancel":"Cancelar",
            "Delete":"Excluir",
            "Done":"Concluído",
            "Continue":"Continuar",
            "Back":"Voltar",
            "Search":"Pesquisar",
            "Send":"Enviar",
            "Microphone":"Microfone",
            "Voice":"Voz",
            "Auto":"Automático",
            "Not connected":"Não conectado",
            "Connect":"Conectar",
            "Connected":"Conectado",
            "No conversations yet":"Nenhuma conversa ainda",
            "Orbit could not finish this response: xAI rejected this request. Check the selected model and try again.":"O JARVIS não conseguiu responder: a xAI rejeitou a solicitação. Selecione um modelo configurado ou conecte outro provedor nas configurações.",
          }
          # Trocas exatas de literais de interface, sem modificar nomes de classes ou APIs.
          root=Path("app/src/main")
          changed=0
          for p in list((root/"java").rglob("*.java"))+list((root/"res").rglob("*.xml")):
            src=p.read_text(encoding="utf-8")
            dst=src
            for english,portuguese in translations.items():
              dst=dst.replace('"'+english+'"','"'+portuguese+'"')
              dst=dst.replace('>'+english+'</string>','>'+portuguese+'</string>')
            if dst!=src:
              p.write_text(dst,encoding="utf-8")
              changed+=1
          print("Arquivos localizados:",changed)
          PY
          chmod +x gradlew
      - name: Compile Orbit-based JARVIS
        working-directory: orbit
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Preserve MPL attribution
        run: |
          mkdir -p output
          cp orbit/app/build/outputs/apk/debug/app-debug.apk "output/JARVIS-Orbit-Base-experimental.apk"
          cp orbit/LICENSE output/ORBIT-LICENSE.txt
      - name: Upload experimental APK and license
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Orbit-Base-experimental
          path: output/
          if-no-files-found: error
